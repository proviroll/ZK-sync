apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-run
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: zk-sync-run
  template:
    metadata:
      labels:
        app: zk-sync-run
    spec:
      containers:
      - name: zk-sync-run
        image: "zk-sync-run:{{ .Values.image.runTag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 3052
          name: http
        env:
        - name: SERVER_DB_URL
          value: "postgres://{{ .Values.postgresql.username }}:$(POSTGRES_PASSWORD)@{{ .Release.Name }}-postgres:{{ .Values.postgresql.port }}/{{ .Values.postgresql.database }}"
        volumeMounts:
        - name: zksync-app-data
          mountPath: /app
      volumes:
      - name: zksync-app-data
        persistentVolumeClaim:
          claimName: zksync-app-data
