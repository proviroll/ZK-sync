apiVersion: apps/v1
kind: Deployment
metadata:
  name: zk-sync-run
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zk-sync-run
  template:
    metadata:
      labels:
        app: zk-sync-run
    spec:
      containers:
      - name: zk-sync-run
        image: your-registry/zk-sync-run:latest
        volumeMounts:
        - name: zksync-app-data
          mountPath: /app
      volumes:
      - name: shared-data
        persistentVolumeClaim:
          claimName: zksync-app-data
