apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-init
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: zk-sync-init
  template:
    metadata:
      labels:
        app: zk-sync-init
    spec:
      containers:
      - name: zk-sync-init
        image: "zk-sync-init:{{ .Values.image.initTag }}"
        envFrom:
        - configMapRef:
            name: zksync-config
        - secretRef:
            name: zksync-secrets
        volumeMounts:
        - name: zksync-app-data
          mountPath: /app
      volumes:
      - name: shared-data
        persistentVolumeClaim:
          claimName: zksync-app-data