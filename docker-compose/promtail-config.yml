---
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_URL}
    tenant_id: proviroll-loki
    basic_auth:
      username: ${LOKI_USERNAME}
      password: ${LOKI_PASSWORD}

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: ${ECOSYSTEM_NAME:-zksync}_${L1_NETWORK:-unknown}
          ecosystem: ${ECOSYSTEM_NAME:-zksync}
          network: ${L1_NETWORK:-unknown}
          __path__: /var/lib/docker/containers/*/*log

    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            time: time
      
      - timestamp:
          source: time
          format: RFC3339Nano

      - labels:
          stream:

      - output:
          source: log
