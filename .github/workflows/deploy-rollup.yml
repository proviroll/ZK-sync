name: Deploy ZKStack Rollup

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      ecosystem_name:
        description: 'Ecosystem Name'
        required: true
        type: string
        default: 'provi'
      chain_name:
        description: 'Chain Name'
        required: true
        type: string
        default: 'proviTestnet'
      l1_network:
        description: 'L1 Network'
        required: true
        type: choice
        options:
          - sepolia
          - mainnet
        default: 'sepolia'
      prover_mode:
        description: 'Prover Mode'
        required: true
        type: choice
        options:
          - gpu
          - cpu
        default: 'gpu'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Create deployment branch
        run: |
          BRANCH_NAME="deploy-${{ inputs.ecosystem_name }}-${{ inputs.l1_network }}-$(date +%Y%m%d-%H%M%S)"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV
          git checkout -b $BRANCH_NAME

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to host
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USERNAME: ${{ secrets.DEPLOY_USERNAME }}
        run: |
          # Create deployment directory
          ssh $USERNAME@$HOST "mkdir -p ~/zksync-deploy/${{ env.BRANCH_NAME }}"

          # Copy files to host
          scp -r ./* $USERNAME@$HOST:~/zksync-deploy/${{ env.BRANCH_NAME }}/

          # Create .env file on the host
          ssh $USERNAME@$HOST "cd ~/zksync-deploy/${{ env.BRANCH_NAME }} && cat > .env << EOL
          ECOSYSTEM_NAME=${{ inputs.ecosystem_name }}
          CHAIN_NAME=${{ inputs.chain_name }}
          WALLET_PATH=/script/wallets.yaml
          PROVER_MODE=${{ inputs.prover_mode }}
          L1_NETWORK=${{ inputs.l1_network }}
          LINK_TO_CODE=/app/zksync
          L1_FAUCET_ADDRESS=${{ secrets.L1_FAUCET_ADDRESS }}
          L1_FAUCET_PRIVATE_KEY=${{ secrets.L1_FAUCET_PRIVATE_KEY }}
          EOL"

          # Run init container with log capture
          ssh $USERNAME@$HOST "cd ~/zksync-deploy/${{ env.BRANCH_NAME }} && \
            docker run --name ${{ inputs.ecosystem_name }}_init \
              --env-file .env \
              -v zksync-app-data:/app \
              zk-sync-init 2>&1 | tee init.log || \
            (docker logs ${{ inputs.ecosystem_name }}_init > init_crash.log 2>&1; \
             docker inspect ${{ inputs.ecosystem_name }}_init > inspect.log 2>&1; \
             docker cp ${{ inputs.ecosystem_name }}_init:/tmp/report-*.toml ./crash-report.toml 2>/dev/null || true; \
             echo '=== Container Logs ==='; \
             cat init.log init_crash.log; \
             echo '=== Crash Report ==='; \
             cat crash-report.toml 2>/dev/null || echo 'No crash report found'; \
             echo '=== Container Inspection ==='; \
             cat inspect.log; \
             exit 1)"

          # Run the run container
          ssh $USERNAME@$HOST "cd ~/zksync-deploy/${{ env.BRANCH_NAME }} && \
            docker run -d --network=host \
              --volumes-from=${{ inputs.ecosystem_name }}_init \
              --name ${{ inputs.ecosystem_name }}_run \
              --env-file .env \
              zk-sync-run"

      - name: Collect logs and config
        if: always()  # Run even if previous steps failed
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USERNAME: ${{ secrets.DEPLOY_USERNAME }}
        run: |
          # Create artifacts directories on both local and remote
          mkdir -p artifacts
          ssh $USERNAME@$HOST "cd ~/zksync-deploy/${{ env.BRANCH_NAME }} && \
            mkdir -p artifacts && \
            cp *.log artifacts/ 2>/dev/null || true && \
            cp *.toml artifacts/ 2>/dev/null || true && \
            docker logs ${{ inputs.ecosystem_name }}_init > artifacts/init_container.log 2>&1 || true && \
            docker logs ${{ inputs.ecosystem_name }}_run > artifacts/run_container.log 2>&1 || true && \
            docker cp ${{ inputs.ecosystem_name }}_init:/tmp/report-*.toml artifacts/ 2>/dev/null || true"
          
          # Copy all artifacts from remote to local
          scp -r $USERNAME@$HOST:~/zksync-deploy/${{ env.BRANCH_NAME }}/artifacts/* artifacts/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zksync-deployment-${{ env.BRANCH_NAME }}
          path: artifacts/