name: Deploy ZKStack Rollup

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main
      - feat/*

  workflow_dispatch:
    inputs:
      ecosystem_name:
        description: 'Ecosystem Name'
        required: true
        type: string
        default: 'provi'
      chain_name:
        description: 'Chain Name'
        required: true
        type: string
        default: 'proviTestnet'
      chain_id:
        description: 'Chain ID'
        required: true
        type: string
        default: '271'
      l1_network:
        description: 'L1 Network'
        required: true
        type: choice
        options:
          - sepolia
          - mainnet
        default: 'sepolia'
      prover_mode:
        description: 'Prover Mode'
        required: true
        type: choice
        options:
          - gpu
          - cpu
        default: 'gpu'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Create deployment branch
        run: |
          BRANCH_NAME="deploy-${{ inputs.ecosystem_name }}-${{ inputs.l1_network }}-$(date +%Y%m%d-%H%M%S)"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV
          git checkout -b $BRANCH_NAME

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to host
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USERNAME: ${{ secrets.DEPLOY_USERNAME }}
        run: |
          # Create deployment directory
          ssh $USERNAME@$HOST "mkdir -p ~/zksync-deploy/${{ env.BRANCH_NAME }}"
          
          # Copy files to host
          scp -r ./* $USERNAME@$HOST:~/zksync-deploy/${{ env.BRANCH_NAME }}/
          
          # Create .env file on the host
          ssh $USERNAME@$HOST "cd ~/zksync-deploy/${{ env.BRANCH_NAME }} && cat > .env << EOL
          ECOSYSTEM_NAME=${{ inputs.ecosystem_name }}
          CHAIN_NAME=${{ inputs.chain_name }}
          CHAIN_ID=${{ inputs.chain_id }}
          WALLET_PATH=/script/wallets.yaml
          PROVER_MODE=${{ inputs.prover_mode }}
          L1_NETWORK=${{ inputs.l1_network }}
          LINK_TO_CODE=/app/zksync
          L1_FAUCET_ADDRESS=${{ secrets.L1_FAUCET_ADDRESS }}
          L1_FAUCET_PRIVATE_KEY=${{ secrets.L1_FAUCET_PRIVATE_KEY }}
          L1_RPC_URL=${{ secrets.L1_RPC_URL }}
          EOL"
          
          # Build and run containers
          ssh $USERNAME@$HOST "cd ~/zksync-deploy/${{ env.BRANCH_NAME }} && \
            docker build -t zk-sync-init ./init && \
            docker build -t zk-sync-run ./run && \
            docker run --network=host \
              --name ${{ inputs.ecosystem_name }}_init \
              --env-file .env \
              -v zksync-app-data:/app \
              zk-sync-init && \
            docker run -d --network=host \
              --volumes-from=${{ inputs.ecosystem_name }}_init \
              --name ${{ inputs.ecosystem_name }}_run \
              --env-file .env \
              zk-sync-run"

      - name: Collect logs and config
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USERNAME: ${{ secrets.DEPLOY_USERNAME }}
        run: |
          mkdir -p artifacts
          ssh $USERNAME@$HOST "cd ~/zksync-deploy/${{ env.BRANCH_NAME }} && \
            docker logs ${{ inputs.ecosystem_name }}_init > init.log && \
            docker logs ${{ inputs.ecosystem_name }}_run > run.log"
          scp $USERNAME@$HOST:~/zksync-deploy/${{ env.BRANCH_NAME }}/*.log artifacts/
          scp -r $USERNAME@$HOST:/app/${{ inputs.ecosystem_name }}/config artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zksync-deployment-${{ env.BRANCH_NAME }}
          path: artifacts/