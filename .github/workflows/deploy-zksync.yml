name: Deploy ZKSync Environment

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main
      - docker-compose-setup
  workflow_dispatch:
    inputs:
      ecosystem_name:
        description: 'Ecosystem Name'
        required: true
        type: string
      chain_name:
        description: 'Chain Name'
        required: true
        type: string
      chain_id:
        description: 'Chain ID'
        required: true
        type: string
        default: '271'
      l1_network:
        description: 'L1 Network (e.g., sepolia)'
        required: true
        type: choice
        options:
          - sepolia
          - mainnet
        default: 'sepolia'
jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Create deployment branch
        run: |
          BRANCH_NAME="deploy-${{ inputs.ecosystem_name }}-${{ inputs.l1_network }}-$(date +%Y%m%d-%H%M%S)"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV
          git checkout -b $BRANCH_NAME

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
            ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
  
      - name: Add known hosts
        run: |
            mkdir -p ~/.ssh
            ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Copy files to remote host
        run: |
          ssh ${{ secrets.DEPLOY_USERNAME }}@${{ secrets.DEPLOY_HOST }} "mkdir -p ~/zksync-deploy/${{ env.BRANCH_NAME }}"
          scp -r ./* ${{ secrets.DEPLOY_USERNAME }}@${{ secrets.DEPLOY_HOST }}:~/zksync-deploy/${{ env.BRANCH_NAME }}/

      - name: Build and run initialization
        env:
          REMOTE_USER: ${{ secrets.DEPLOY_USERNAME }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh ${{ secrets.DEPLOY_USERNAME }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            cd ~/zksync-deploy/${{ env.BRANCH_NAME }}
            
            # Create .env file
            cat > .env << EOF
            ECOSYSTEM_NAME="${{ inputs.ecosystem_name }}"
            CHAIN_NAME="${{ inputs.chain_name }}"
            CHAIN_ID="${{ inputs.chain_id }}"
            L1_NETWORK="${{ inputs.l1_network }}"
            FAUCET_ADDRESS="${{ secrets.L1_FAUCET_ADDRESS }}"
            FAUCET_PRIVATE_KEY="${{ secrets.L1_FAUCET_PRIVATE_KEY }}"
            L1_RPC_URL="${{ secrets.L1_RPC_URL }}"
            LINK_TO_CODE=""
            POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
            EOF

            # Build and start services using docker-compose
            docker-compose --profile init up --build -d

            # Wait for initialization to complete and copy wallets
            mkdir -p artifacts
            if [ -f /script/wallets.yaml ]; then
              cp /script/wallets.yaml artifacts/
            fi
          ENDSSH

      - name: Save wallets
        run: |
          mkdir -p artifacts
          scp ${{ secrets.DEPLOY_USERNAME }}@${{ secrets.DEPLOY_HOST }}:~/zksync-deploy/${{ env.BRANCH_NAME }}/artifacts/* artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zksync-wallets-${{ env.BRANCH_NAME }}
          path: artifacts/

   